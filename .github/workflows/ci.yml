name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            preset: windows-msvc-release
            qt_arch: win64_msvc2022_64
          - name: Linux GCC
            os: ubuntu-latest
            preset: linux-release
            qt_arch: linux_gcc_64
          - name: macOS AppleClang
            os: macos-latest
            preset: macos-release
            qt_arch: clang_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1 \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
